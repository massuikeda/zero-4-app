# バックエンド（FastAPI）を Azure App Service にデプロイする。
# main に backend/ の変更が入ったとき、または Actions の画面から手動で実行したときに動く。
# 必要な設定は docs/DEPLOY.md を参照。
name: バックエンドをデプロイ（App Service）

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: パッケージのインストール
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: テスト
        run: pytest -q

  deploy:
    name: デプロイ
    needs: test # テストが通ったときだけデプロイする
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 設定の確認
        run: |
          if [ -z "${{ vars.AZURE_BACKEND_WEBAPP_NAME }}" ]; then
            echo "::error::リポジトリの変数 AZURE_BACKEND_WEBAPP_NAME（バックエンドの App Service の名前）が設定されていません。docs/DEPLOY.md を参照してください"
            exit 1
          fi

      - name: App Service にデプロイ
        uses: azure/webapps-deploy@v3
        with:
          # 発行プロファイル（App Service ごとのデプロイ用のID・パスワード）でデプロイする
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          app-name: ${{ vars.AZURE_BACKEND_WEBAPP_NAME }}
          # Python のパッケージ（requirements.txt）は Azure 側でインストールする
          # （アプリ設定 SCM_DO_BUILD_DURING_DEPLOYMENT=true が必要）
          package: backend
